{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <style>
    .A {
      display: flex;
      list-style: none;
      gap: 120px;
      background-color: thistle;
      position: fixed;
      z-index: 1;
      top: 0;
      width: 100%;
      align-items: center;
      padding: 10px 20px;
    }
    .A li:hover {
      color: blue;
    }
  </style>
</head>
<body>
<div class="container-fluid">
  <ul class="A">
    <li><img src="{% static 'loga.jpg' %}" alt="" style="height: 40px;"></li>
    <li><a href="{% url 'home' %}"><button class="btn">Home</button></a></li>

    <li>
      <div class="dropdown">
        <button type="button" class="btn dropdown-toggle" data-bs-toggle="dropdown">
          Categories
        </button>
        <ul class="dropdown-menu">
          <li><a class="dropdown-item" href="{% url 'categories' 'fruits' %}">Fruits</a></li>
          <li><a class="dropdown-item" href="{% url 'categories' 'vegetables' %}">Vegetables</a></li>
          <li><a class="dropdown-item" href="{% url 'categories' 'DRY FRUITS' %}">Dryfruits</a></li>
          <li><a class="dropdown-item" href="{% url 'categories' 'SNACKS' %}">Snacks</a></li>
          <li><a class="dropdown-item" href="{% url 'categories' 'Oils' %}">Oils</a></li>
          <li><a class="dropdown-item" href="{% url 'categories' 'COOL DRINKS' %}">Cooldrinks</a></li>
        </ul>
      </div>
    </li>

    <li>
      <form method="post" action="{% url 'filter_data' %}">
        {% csrf_token %}
        <input type="text" placeholder="search here" class="form-control" name="query" style="width: 400px;">
      </form>
    </li>

    <li><a href="{% url 'show_cart' %}"><button class="btn">Cart</button></a></li>

    <li>
      <div class="dropdown">
        <i class="btn bi bi-list-task dropdown-toggle" data-bs-toggle="dropdown" role="button" aria-expanded="false"></i>
        <ul class="dropdown-menu">
          <li><a class="dropdown-item" href=""><i class="bi bi-person-circle"></i>&nbsp;&nbsp;&nbsp; name</a></li>
          <li><a class="dropdown-item" href="{% url 'login1' %}">logout</a></li>
        </ul>
      </div>
    </li>
  </ul>

  {% block content %}
  {% endblock %}
</div>
</body>
</html>
