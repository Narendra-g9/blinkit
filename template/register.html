<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <title>Bootstrap demo</title>
  </head>
  <body>
    <br>
    <div class="container ">
        <div class="row">
          <div class="col-md-3"></div>
            <div class="col-md-6">
                <div class="bg-light p-5rounded">
                    <hr>
                    <h1 class="text-center text-white bg-danger">Registration</h1>
                    <hr>
                            </div>
                            <form action="{% url 'register1' %}" method="post">
                                {% csrf_token %}
                              <div class="container mt-4">
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person-plus-fill"></i></span>
                                    <input type="text" placeholder="User_Name" name="username" id="c" class="form-control" autocomplete="off">
                                </div>
                            </div>


                                    <div class="container mt-4">
                                        <div class="input-group">
                                            <span class="input-group-text"><i class=" bi bi-eye-fill"></i></span>
                                            <input type="password" placeholder="password" name="password" id="d" class="form-control" autocomplete="off">
                                        </div>
                                    </div>
                                            <div class="container mt-4">
                                                <div class="input-group">
                                                    <span class="input-group-text"><i class="bi bi-eye-fill"></i></span>
                                                    <input type="password" placeholder="confirm_password" name="confirm_password" id="e" class="form-control" autocomplete="off">
                                                </div>
                                            </div>
                                             <div class="container mt-4">
                                                <div class="input-group">
                                                    <span class="input-group-text"><i class="bi bi-telephone-fill"></i></span>
                                                    <input type="text" placeholder="Phone_Number" name="phonenumber" id="f" class="form-control" autocomplete="off">
                                                </div>
                                            </div> 
                                             <div class="container mt-4">
                                                <div class="input-group">
                                                    <span class="input-group-text"><i class="bi bi-envelope-open-fill"></i></span>
                                                    <input type="text" placeholder="E-mail" name="email" id="g" class="form-control" autocomplete="off">
                                                </div>
                                            </div>

                                                 <div class="container mt-4">
                                                <div class="input-group">
                                                    <span class="input-group-text"><i class="bi bi-house-door-fill"></i></span>
                                                    <!-- <input type="text" placeholder="Address" name="address" id="h" class="form-control" autocomplete="off"> -->
                                                <textarea class="form-control" rows="5px" name="address"></textarea>
                                                </div>
                                            </div>
                                            <br>
                                            <div class="d-grid gap-2 d-md-block">
                                                <!-- <div class="d-flex justify-conyent-center"> -->
                                                <button type="submit" class="btn btn-outline-success" style="margin-left: 300px;" >Submit</button>
                                                <!-- </div> -->
                                            </div>  
                                            </form>  
                </div>
            </div>
        </div>
    </div>
  </body>
</html>
